# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a5549e02ffc6871bffe0b5ee575ed261"
name = "oman-gege"
application_url = "https://qr-code-generator-two-silk.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2027-01"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [ "https://qr-code-generator-two-silk.vercel.app/auth/callback" ]

[metaobjects.app.qr_code]
name = "QR Code"
display_name_field = "title"

  [metaobjects.app.qr_code.access]
  admin = "merchant_read_write"

[metaobjects.app.qr_code.fields.title]
type = "single_line_text_field"
name = "Title"
required = true

[metaobjects.app.qr_code.fields.product]
type = "product_reference"
name = "Product"

[metaobjects.app.qr_code.fields.product_variant]
type = "variant_reference"
name = "Product Variant"

[metaobjects.app.qr_code.fields.destination]
type = "single_line_text_field"
name = "Destination"

  [metaobjects.app.qr_code.fields.destination.validations]
  choices = [ "product", "cart" ]

[metaobjects.app.qr_code.fields.discount_code]
type = "single_line_text_field"
name = "Discount Code"

[metaobjects.app.qr_code.fields.scans]
type = "number_integer"
name = "Scans"
