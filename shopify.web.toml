name = "React Router"
roles = ["frontend", "backend"]
webhooks_path = "/webhooks"

[commands]
dev = "cross-env NODE_OPTIONS=--no-experimental-require-module npx prisma generate && cross-env NODE_OPTIONS=--no-experimental-require-module npx prisma migrate deploy && cross-env NODE_OPTIONS=--no-experimental-require-module npm exec react-router dev"
